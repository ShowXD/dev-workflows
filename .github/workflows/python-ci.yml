name: Python CI

on:
  workflow_call:
    inputs:
      python-version:
        description: Python version used by the project
        required: false
        type: string
        default: "3.14"

      qt:
        description: Install Qt/PySide6 runtime dependencies for headless testing
        required: false
        type: boolean
        default: false

    secrets:
      SEMGREP_APP_TOKEN:
        required: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ inputs.python-version }}

      - name: Install Qt system dependencies
        if: ${{ inputs.qt }}
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 \
            libgl1 \
            libxkbcommon-x11-0

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip

          if [ -f requirements.txt ]; then
            python -m pip install -r requirements.txt
          elif [ -f pyproject.toml ]; then
            python -m pip install .
          fi

          python -m pip install pytest

      - name: Test
        if: ${{ !inputs.qt }}
        run: python -m pytest

      - name: Test Qt project
        if: ${{ inputs.qt }}
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest

  security:
    uses: ShowXD/dev-workflows/.github/workflows/security.yml@main
    secrets:
      SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}